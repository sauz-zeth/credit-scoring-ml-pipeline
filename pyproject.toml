[project]
name = "credit-scoring"
version = "0.1.0"
description = "Tabular ML pipeline for credit scoring portfolio"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Alex Pechul" }]
dependencies = [
    "catboost>=1.2.7",
    "joblib>=1.4.2",
    "lightgbm>=4.5.0",
    "matplotlib>=3.9.2",
    "numpy>=1.26.4",
    "openml>=0.15.1",
    "pandas>=2.2.3",
    "pyarrow>=14",
    "pyspark>=3.5,<4",
    "kaggle>=1.6.17",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.5.2",
    "seaborn>=0.13.2",
    "shap>=0.46.0",
    "typer>=0.12.5",
]

[project.scripts]
credit-scoring = "credit_scoring.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
